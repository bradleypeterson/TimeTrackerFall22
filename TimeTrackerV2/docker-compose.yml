services:
  node:
    tty: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "TimeTracker <no-reply@timetracker.test>"
      APP_URL: "http://localhost"
    build:
      context: ./NodeAPI
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./NodeAPI:/usr/src/app
      - /usr/src/app/node_modules

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - node

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"
