services:
    node:
        tty: true
        environment: 
            - CHOKIDAR_USEPOLLING=true
        build:
            context: './NodeAPI'
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        volumes:
            - ./NodeAPI:/usr/src/app
            - /usr/src/app/node_modules

    nginx:  
        # This builds Angular and puts the finished website inside nginx.
        build:
            context: .  
            dockerfile: Dockerfile.nginx 
        ports:
            - "80:80"
        depends_on:
            # Starts Node first because nginx sends API requests to it.
            - node