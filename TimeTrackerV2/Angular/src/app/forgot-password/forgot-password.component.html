<div class="card mx-auto mt-5" style="max-width: 440px; width: 90%;">
    <div class="card-header">Forgot your password?</div>

    <div class="card-body">
      <p>Enter your username to request a password-reset link.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label for="forgot-username">Username</label>
        <input
          id="forgot-username"
          formControlName="username"
          class="form-control mb-3"
          autocomplete="username"
          maxlength="200"
          required
        />

        <button
          type="submit"
          class="btn btn-purple w-100"
          [disabled]="busy"
        >
          {{ busy ? 'Sending…' : 'Send reset link' }}
        </button>

        <div
          *ngIf="message"
          class="alert alert-info mt-3"
          role="status"
        >
          {{ message }}
        </div>
      </form>

      <p class="small text-muted mt-3">
        No recovery email set up? Contact your administrator.
      </p>

      <a routerLink="/" class="d-block text-center mt-3">
        Back to Login
      </a>
    </div>
  </div>
