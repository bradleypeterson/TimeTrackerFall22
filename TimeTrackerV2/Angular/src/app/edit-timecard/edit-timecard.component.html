<div id="edit-timecard">
  <h2>Edit TimeCard</h2>
  <hr />

  <form [formGroup]="editTimecardForm" (ngSubmit)="onSubmit()">
    <p class="errorText">{{ errMsg }}</p>

    <div class="form-group">
      <input
        id="studentName"
        formControlName="studentName"
        type="text"
        class="form-control"
        name="studentName"
        placeholder="{{ firstName }} {{ lastName }}"
        readonly
      />
    </div>
    <div class="form-group">
      <label for="timeIn"><strong>Time In</strong></label>
      <input
        id="timeIn"
        formControlName="timeIn"
        type="datetime-local"
        class="form-control"
        name="timeIn"
        ng-model="timecard.timeIn"
      />
    </div>
    <div class="form-group">
      <label for="timeOut"><strong>Time Out</strong></label>
      <input
        id="timeOut"
        formControlName="timeOut"
        type="datetime-local"
        class="form-control"
        name="timeOut"
        ng-model="timecard.timeOut"
      />
    </div>

    <div
      *ngIf="editTimecardForm.errors?.dateRange && !errMsg"
      class="mt-2 errorText"
    >
      Time Out must be later than Time In.
    </div>

    <div class="form-group">
      <label for="description"><strong>Work description</strong></label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        rows="4"
      ></textarea>
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-success">Save</button>
      <button
        type="button"
        class="btn btn-danger"
        (click)="NavigateBackToProject()"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
