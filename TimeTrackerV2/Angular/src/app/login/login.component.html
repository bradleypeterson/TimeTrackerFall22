<div id="login" ng-cloak>
  <div class="row no-gutters">
    <div class="col"></div>
    <!-- Extra col div for some auto bootstrap centering -->
    <div class="card mt-5 login-card">
      <div class="card-header">Login</div>
      <div class="card-body">
        <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
          <div>
            <p *ngIf="errMsg" class="errorText" role="alert">
              {{ errMsg }}
            </p>
          </div>
          <div class="input-group">
            <div class="input-group-prepend">
              <span
                class="input-group-text"
                style="width: 40px; border: none; border-bottom-left-radius: 0"
                ><i class="fa fa-user" aria-hidden="true"></i
              ></span>
            </div>
            <input
              formControlName="username"
              id="username"
              type="text"
              class="form-control bg-light"
              style="border: none; border-bottom-right-radius: 0"
              name="username"
              placeholder="Username"
              ng-model=""
              required
            />
          </div>
          <div class="input-group" style="margin-top: 1px">
            <div class="input-group-prepend">
              <span
                class="input-group-text"
                style="width: 40px; border: none; border-top-left-radius: 0"
                ><i class="fa fa-lock" aria-hidden="true"></i
              ></span>
            </div>
            <input
              formControlName="password"
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control bg-light"
              style="border: none; border-top-right-radius: 0"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="btn password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="
                showPassword ? 'Hide password' : 'Show password'
              "
              [attr.aria-pressed]="showPassword"
            >
              <i
                class="fa"
                [class.fa-eye]="!showPassword"
                [class.fa-eye-slash]="showPassword"
                aria-hidden="true"
              ></i>
            </button>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-purple w-100">
              Login
            </button>
          </div>

          <div class="text-center mt-3">
            <a class="login-link" routerLink="/forgot-password">
              Forgot password?
            </a>
          </div>

          <div class="registration-link">
            Don’t have an account?
            <a class="login-link" routerLink="/register">Create an account</a>
          </div>
        </form>
      </div>
    </div>
    <div class="col"></div>
    <!-- Extra col div for some auto bootstrap centering -->
  </div>
</div>
