<div id="viewEval">
  <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h3>Evaluation Responses</h3>
    <button class="btn btn-secondary" (click)="backToEvaluations()">Back to Evaluations</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="responses.length > 0">
    <p><strong>Student:</strong> {{ responses[0].studentName }}</p>
    <p><strong>Project:</strong> {{ responses[0].projectName }}</p>
    <p><strong>Evaluation Form:</strong> {{ responses[0].templateName }}</p>

    <div *ngFor="let response of responses; let i = index" class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ i + 1 }}. {{ response.questionText }}</h5>
        <p class="mb-0" *ngIf="response.questionType === '1-5 Rating'">
          <strong>Rating:</strong> {{ response.rating }}
        </p>
        <p class="mb-0" *ngIf="response.questionType === 'Text Response'">
          <strong>Response:</strong> {{ response.response }}
        </p>
      </div>
    </div>
  </div>
</div>
