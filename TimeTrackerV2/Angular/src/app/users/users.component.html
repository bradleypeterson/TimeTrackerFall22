<!-- ng-cloak ng-if="loaded" -->

<div id="users">
  <h2 class="mb-3">Users</h2>

  <div class="row">
    <!-- ng-model="search" -->
    <form
      [formGroup]="searchForm"
      (ngSubmit)="filterUsers()"
      class="col-12 mb-3"
    >
      <h3 class="h6 mb-2">Filter users</h3>

      <div class="row g-2">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="input-group">
            <span class="input-group-text">Name</span>
            <input
              formControlName="name"
              type="text"
              id="name"
              class="form-control"
            />
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="input-group">
            <span class="input-group-text">Active</span>
            <select
              formControlName="active"
              id="isActive"
              class="form-select form-control"
            >
              <option value="" selected></option>
              <option value="true">True</option>
              <option value="false">False</option>
            </select>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="input-group">
            <span class="input-group-text">Approved</span>
            <select
              formControlName="approved"
              id="isApproved"
              class="form-select form-control"
            >
              <option value="" selected></option>
              <option value="true">True</option>
              <option value="false">False</option>
            </select>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="input-group">
            <span class="input-group-text">User Type</span>
            <select
              formControlName="type"
              id="type"
              class="form-select form-control"
            >
              <option value="" selected></option>
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button class="btn btn-purple" type="submit">Search</button>
          <button class="btn btn-purple" type="reset">Clear</button>
        </div>
      </div>
    </form>
  </div>

  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
  <div *ngIf="errMsg" class="alert alert-danger">{{ errMsg }}</div>
  <div *ngIf="infoMsg" class="alert alert-info">{{ infoMsg }}</div>

  <div class="table-responsive">
    <table class="table table-hover table-sm align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th class="text-center">Active</th>
          <th class="text-center">Approved</th>
          <th class="text-center d-none d-sm-table-cell">Type</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>

      <!-- ng-repeat="u in users | orderObjectBy : 'firstName' | filter : search" -->
      <tbody>
        <tr *ngFor="let u of filteredUsers" class="position-relative">
          <td>
            <button class="btn-link" (click)="ViewProfile(u.userID)">
              {{ u.firstName }} {{ u.lastName }}
            </button>
          </td>

          <td>
            <div class="full-width">{{ u.username }}</div>
          </td>

          <td class="text-center">
            <div class="pretty p-curve p-svg mr-0">
              <input
                type="checkbox"
                [checked]="u.isActive"
                [(ngModel)]="u.isActive"
                (ngModelChange)="MarkUserChanged()"
                [disabled]="currentUserID === u.userID"
              />
              <div class="state p-primary">
                <svg class="svg svg-icon" viewBox="0 0 20 20">
                  <path
                    d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                    style="stroke: white; fill: white"
                  ></path>
                </svg>
                <label></label>
              </div>
            </div>
          </td>

          <td class="text-center">
            <div class="pretty p-curve p-svg mr-0">
              <input
                type="checkbox"
                [checked]="u.isApproved"
                [(ngModel)]="u.isApproved"
                (ngModelChange)="MarkUserChanged()"
                [disabled]="currentUserID === u.userID"
              />
              <div class="state p-primary">
                <svg class="svg svg-icon" viewBox="0 0 20 20">
                  <path
                    d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l8.219-8.221c0.252-0.252,0.252-0.659,0-0.911c-0.252-0.252-0.659-0.252-0.911,0l-7.764,7.763L4.152,9.267c-0.252-0.251-0.66-0.251-0.911,0c-0.252,0.252-0.252,0.66,0,0.911L7.629,14.566z"
                    style="stroke: white; fill: white"
                  ></path>
                </svg>
                <label></label>
              </div>
            </div>
          </td>

          <td class="text-center d-none d-sm-table-cell">
            <select
              [(ngModel)]="u.type"
              (ngModelChange)="MarkUserChanged()"
              [disabled]="currentUserID === u.userID"
            >
              <option value="student" [selected]="u.type == 'student'">
                Student
              </option>
              <option value="instructor" [selected]="u.type == 'instructor'">
                Instructor
              </option>
              <option value="admin" [selected]="u.type == 'admin'">
                Admin
              </option>
            </select>
          </td>

          <td class="text-center">
            <button
              *ngIf="UserModified(u)"
              type="button"
              class="btn btn-primary btn-sm"
              (click)="SaveUserChanges(u)"
            >
              Save Changes
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
