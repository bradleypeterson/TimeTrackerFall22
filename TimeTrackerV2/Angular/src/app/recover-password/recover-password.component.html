<div class="card mx-auto mt-5" style="max-width: 440px; width: 90%;">
    <div class="card-header">Choose a new password</div>

    <div class="card-body">
      <p *ngIf="message" role="status">{{ message }}</p>

      <form
        *ngIf="!completed"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
      >
        <label for="new-password">New password</label>
        <input
          id="new-password"
          type="password"
          formControlName="password"
          class="form-control mb-3"
          autocomplete="new-password"
          required
        />

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          formControlName="confirmPassword"
          class="form-control mb-3"
          autocomplete="new-password"
          required
        />

        <button
          type="submit"
          class="btn btn-purple w-100"
          [disabled]="busy"
        >
          {{ busy ? 'Saving…' : 'Reset password' }}
        </button>
      </form>

      <a routerLink="/" class="d-block mt-3">Back to Login</a>
      <a *ngIf="!completed" routerLink="/forgot-password">
        Request a new reset link
      </a>
    </div>
  </div>
