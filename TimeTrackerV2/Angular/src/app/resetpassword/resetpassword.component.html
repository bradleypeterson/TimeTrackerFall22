<!-- ngSubmit handles both the Save button and pressing Enter. -->
<form [formGroup]="resetForm" (ngSubmit)="onSubmit()">

    <!-- Non-admin users must confirm their own current password.
         Admin permissions are verified separately by the backend. -->
    <div *ngIf="!isAdmin" class="mb-3">
      <label for="current-password" class="form-label">
        Current password
      </label>
      <input
        id="current-password"
        type="password"
        class="form-control"
        formControlName="currentPassword"
        autocomplete="current-password"
        required
      />
    </div>

    <div class="mb-3">
      <label for="new-password" class="form-label">
        New password
      </label>
      <input
        id="new-password"
        type="password"
        class="form-control"
        formControlName="newPswd"
        autocomplete="new-password"
        required
      />
    </div>

    <!-- Require confirmation to catch mistakes in the new password. -->
    <div class="mb-3">
      <label for="confirm-password" class="form-label">
        Confirm new password
      </label>
      <input
        id="confirm-password"
        type="password"
        class="form-control"
        formControlName="confirm"
        autocomplete="new-password"
        required
      />
    </div>

    <!-- Announce validation and API errors without leaving the form. -->
    <div
      *ngIf="errorMessage"
      class="mb-3 errorText"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <!-- Disable actions while saving to prevent duplicate submissions. -->
    <button
      type="submit"
      class="btn btn-purple"
      [disabled]="busy"
    >
      {{ busy ? 'Saving…' : 'Save password' }}
    </button>

    <!-- type="button" ensures Cancel never submits the form. -->
    <button
      type="button"
      class="btn btn-danger"
      [disabled]="busy"
      (click)="NavigateBackToProfile()"
    >
      Cancel
    </button>
  </form>
