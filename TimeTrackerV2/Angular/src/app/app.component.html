<!-- Toolbar -->
<div class="navbar navbar-expand-lg sticky-top">
  <a class="navbar-left">
    <img
      height="40"
      alt="Time Tracker Logo"
      src="../assets/Images/TimeTrackerLogo.png"
    />
  </a>
  <button
    class="navbar-toggler custom-toggler"
    type="button"
    (click)="isNavbarExpanded = !isNavbarExpanded"
    aria-controls="navbarNavAltMarkup"
    [attr.aria-expanded]="isNavbarExpanded"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNavAltMarkup" [class.show]="isNavbarExpanded">
    <div [ngSwitch]="true">
      <!-- INSTRUCTOR SWITCH CASE -->
      <div *ngSwitchCase="instructor">
        <div class="navbar-nav mx-auto">
          <div class="nav-menu">
            <button type="button" class="nav-link" (click)="toggleMenu('account')"
              [attr.aria-expanded]="openMenu === 'account'" aria-controls="account-menu">
              {{ name }} <span aria-hidden="true">▾</span>
            </button>
            <div *ngIf="openMenu === 'account'" id="account-menu" class="nav-panel account-panel">
              <button type="button" class="nav-link" (click)="onUserOptionChange('viewProfile')">View Profile</button>
              <button type="button" class="nav-link" (click)="onUserOptionChange('#')">Logout</button>
            </div>
          </div>
          <div class="nav-menu">
            <button type="button" class="nav-link" (click)="toggleMenu('course')"
              [attr.aria-expanded]="openMenu === 'course'" aria-controls="course-menu">
              Course Options <span aria-hidden="true">▾</span>
            </button>
            <div *ngIf="openMenu === 'course'" id="course-menu" class="nav-panel">
              <a class="nav-link" href="/create-course" (click)="openMenu = null">Create New Course</a>
              <a class="nav-link" href="/past-courses" (click)="openMenu = null">Past Courses</a>
              <a class="nav-link" href="/manage-evals" (click)="openMenu = null">Manage Evaluations</a>
            </div>
          </div>
          <div>
            <a
              class="nav-link"
              routerLink="./dashboard"
              >Dashboard</a
            >
          </div>
        </div>
      </div>
      <!-- STUDENT SWITCH CASE -->
      <div *ngSwitchCase="student">
        <div class="navbar-nav mx-auto">
          <div class="nav-menu">
            <button type="button" class="nav-link" (click)="toggleMenu('account')"
              [attr.aria-expanded]="openMenu === 'account'" aria-controls="account-menu">
              {{ name }} <span aria-hidden="true">▾</span>
            </button>
            <div *ngIf="openMenu === 'account'" id="account-menu" class="nav-panel account-panel">
              <button type="button" class="nav-link" (click)="onUserOptionChange('viewProfile')">View Profile</button>
              <button type="button" class="nav-link" (click)="onUserOptionChange('#')">Logout</button>
            </div>
          </div>
          <div>
            <a
              class="nav-link"
              routerLink="./dashboard"
              >Dashboard</a
            >
          </div>
          <div>
            <a
              class="nav-link"
              routerLink="./courses"
              >Courses</a
            >
          </div>
        </div>
      </div>
      <!-- ADMIN SWITCH CASE -->
      <div *ngSwitchCase="admin">
        <div class="navbar-nav mx-auto">
          <div class="nav-menu">
            <button type="button" class="nav-link" (click)="toggleMenu('account')"
              [attr.aria-expanded]="openMenu === 'account'" aria-controls="account-menu">
              {{ name }} <span aria-hidden="true">▾</span>
            </button>
            <div *ngIf="openMenu === 'account'" id="account-menu" class="nav-panel account-panel">
              <button type="button" class="nav-link" (click)="onUserOptionChange('viewProfile')">View Profile</button>
              <button type="button" class="nav-link" (click)="onUserOptionChange('#')">Logout</button>
            </div>
          </div>
          <div class="nav-menu">
              <!-- Need to create NEW route for admin to search through instructors/courses and the ability to create/delete/edit them (including assignning/removing students and evals). 
               Right now the functionality is the same as the instructors abilities.-->
            <button type="button" class="nav-link" (click)="toggleMenu('course')"
              [attr.aria-expanded]="openMenu === 'course'" aria-controls="course-menu">
              Course Options <span aria-hidden="true">▾</span>
            </button>
            <div *ngIf="openMenu === 'course'" id="course-menu" class="nav-panel">
              <a class="nav-link" href="/create-course" (click)="openMenu = null">Create New Course</a>
              <a class="nav-link" href="/past-courses" (click)="openMenu = null">Past Courses</a>
              <a class="nav-link" href="/manage-evals" (click)="openMenu = null">Manage Evaluations</a>
            </div>
          </div>
          <div>
            <a
              class="nav-link"
              routerLink="./users"
              >Users</a
            >
          </div>
          <div>
            <a
              class="nav-link"
              routerLink="./dashboard"
              >Dashboard</a
            >
          </div>
        </div>
      </div>
      <div *ngSwitchDefault>
        <div class="navbar-nav"></div>
      </div>
    </div>
  </div>
</div>

<div class="container mt-2 navbar-content">
  <router-outlet></router-outlet>
</div>
