<div id="viewEvals">
  <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h3>Evaluation Results</h3>
    <button class="btn btn-secondary" (click)="backToCourse()">Back to Course</button>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!errorMessage && evaluations.length === 0" class="alert alert-info">
    No evaluations have been assigned in this course.
  </div>

  <div *ngIf="evaluations.length > 0" class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>Student</th>
          <th>Project</th>
          <th>Evaluation Form</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let evaluation of evaluations">
          <td>{{ evaluation.studentName }}</td>
          <td>{{ evaluation.projectName }}</td>
          <td>{{ evaluation.templateName }}</td>
          <td>
            <span [class.text-success]="evaluation.evalCompleted" [class.text-warning]="!evaluation.evalCompleted">
              {{ evaluation.evalCompleted ? 'Submitted' : 'Pending' }}
            </span>
          </td>
          <td>
            <button
              *ngIf="evaluation.evalCompleted"
              class="btn btn-purple btn-sm"
              (click)="viewEvaluation(evaluation.assignedEvalID)"
            >
              View
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
