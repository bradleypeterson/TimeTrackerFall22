<div id="view-issues">
  <h2>Unresolved issues</h2>
  <div>
    <table class="table table-hover issue-table">
      <thead>
        <tr>
        <th class="table-head" style="width: 900px;">Bug Description</th>
        <th class="table-head">Name</th>
        <th class="table-head" style="width: 100px;">Role</th>
        <th class="table-head"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of unresolvedIssues">
          <td>{{ u.description }}</td>
          <td>{{ u.name }}</td>
          <td>{{ u.type }}</td>
          <td>
            <div class="btn-group float-right">
                <button class="btn btn-purple" style="width: 180px;"
                 (click)="MarkResolved(u.bugReportID)">Mark as resolved</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="unresolvedIssues.length == 0">
        No active issues! Good job!
    </div>
  </div>
  <h2 style="padding-top: 20px">Resolved issues</h2>
  <div>
    <table class="table table-hover issue-table">
      <thead>
        <tr>
        <th class="table-head" style="width: 900px;">Bug Description</th>
        <th class="table-head">Name</th>
        <th class="table-head" style="width: 100px;">Role</th>
        <th class="table-head"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of resolvedIssues">
          <td>{{ r.description }}</td>
          <td>{{ r.name }}</td>
          <td>{{ r.type }}</td>
          <td>
            <div class="btn-group float-right">
                <button class="btn btn-danger" style="width: 180px;" 
                  (click)="MarkUnresolved(r.bugReportID)">Mark as unresolved</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="resolvedIssues.length == 0">
        No resolved issues found
    </div>
  </div>
